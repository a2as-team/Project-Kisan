          (Clear recommendations), 4. **कार्य योजना** (Action plan), '**💬 Communication Style:**', '- **भाषा**: सरल हिंदी
          (technical terms को explain करें)', '- **Dates**: DD-MM-YYYY format में', '- **Recommendations**: प्राथमिकता के
          साथ', '**⚠️ Error Handling:**', '**"no_data" Response:**', '- Alternative suggestions दें', '- Commodity name correction
          के लिए कहें', '**"error" Response:**', '- Technical issue acknowledge करें', '- Manual research के लिए suggest करें',
        '**🚀 Example Workflows:**', '**Simple Price Query:**', '```', 'Action: get_market_prices(commodity="Onion", days=3)',
        'Response:', '```', '**Detailed Analysis Query:**', '```', 'Action: get_price_analysis(commodity="Tomato")', 'Response:',
        '```', '**Selling Advice Query:**', '```', 'Action: get_selling_advice(commodity="Potato", quantity=10, urgency="urgent")',
        'Response:', '```', '**💡 Smart Features:**', '1. **Context Awareness**: पिछली बातचीत को remember करें', '2. **Proactive
          Suggestions**: related commodities के बारे में भी बताएं', '3. **Seasonal Insights**: मौसम के आधार पर सलाह', '4.
          **Risk Warnings**: price volatility के बारे में चेतावनी', '**🔍 Quality Checks:**', '- हमेशा tool response check
          करें', '- Status "success" हो तो detailed response दें', '- Status "no_data" हो तो helpful alternatives suggest
          करें', '- Status "error" हो तो reassure करें और retry option दें', '**📊 Data Presentation:**', '- Tables के लिए
          clear formatting', '- Important numbers को highlight करें', '- Trends को emoji के साथ show करें (📈📉📊)', '- Dates
          को Indian format में (DD-MM-YYYY)']
      output_key: market_specialist_response
      function: create_market_agent
  weather_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [get_weather_forecast, get_current_weather]
    params:
      name: weather_specialist
      description: Expert in agricultural meteorology and weather-based farming recommendations
      instruction: ['You are WeatherWise, an expert agricultural meteorologist.', 'Your responsibilities:', 1. Receive raw
          weather data (current conditions and forecasts) from tools., '2. Analyze the data in the context of the user''s
          crops, location, and experience level.', '3. Generate actionable farming advice:', • Irrigation scheduling, • Pest
          and disease management, '• Crop operations (planting, spraying, harvesting)', '• Warnings for extreme weather (heat,
          frost, rain)', '4. Present advice in clear, simple language that farmers can follow.', '5. Adapt advice for multiple
          crops, and integrate multi-domain factors if relevant.']
      output_key: last_weather_advice
      function: create_weather_agent

models:
  gemini-2.0-flash:
    type: literal
    agents: [crop_health_agent, market_agent, government_schemes_agent, agent.create_main_farmbot_agent, weather_agent]

tools:
  analyze_crop_image:
    type: function
    agents: [crop_health_agent]
    params:
      description: |-
        Analyze crop image using AI for disease/pest detection

        Args:
            image_data (str): Base64 encoded image data
            location (str, optional): Farmer's location for localized advice
            crop_type (str, optional): Type of crop for specific analysis
            additional_info (str, optional): Additional context from farmer
            tool_context (ToolContext): Optional session context

        Returns:
            Dict: Disease diagnosis and initial recommendations
  check_eligibility:
    type: function
    agents: [government_schemes_agent]
    params:
      description: Check farmer's eligibility for a specific scheme
  get_application_process:
    type: function
    agents: [government_schemes_agent]
    params:
      description: Get step-by-step application process for a scheme
  get_current_weather:
    type: function
    agents: [weather_agent]
    params:
      description: Fetch current weather for a given location
  get_disease_treatment_info:
    type: function
    agents: [crop_health_agent]
    params:
      description: |-
        Get comprehensive AI-powered treatment information for crop diseases/pests

        Args:
            disease_name (str): Name of the disease/pest
            crop_type (str, optional): Type of crop affected
            severity (str): Severity level (low/medium/high/critical)
            location (str, optional): Location for local context
            farmer_budget (str): Budget level (low/medium/high)
            urgency (str): Treatment urgency (immediate/urgent/normal)
            tool_context (ToolContext): Optional session context

        Returns:
            Dict: Comprehensive AI-generated treatment plan
  get_market_prices:
    type: function
    agents: [market_agent]
    params:
      description: |-
        Get current market prices for a specific commodity from database

        Args:
            commodity (str): Name of the commodity (e.g., "Onion", "Tomato")
            state (str, optional): State filter
            district (str, optional): District filter
            days (int): Number of days to fetch data for (default: 7)
            tool_context (ToolContext): Optional session context

        Returns:
            Dict: Current prices, trends, and market information
  get_price_analysis:
    type: function
    agents: [market_agent]
    params:
      description: |-
        Get detailed price analysis and trends for a commodity

        Args:
            commodity (str): Name of the commodity
            analysis_days (int): Number of days for analysis (default: 30)
            tool_context (ToolContext): Optional session context

        Returns:
            Dict: Comprehensive price analysis with trends and patterns
  get_scheme_details:
    type: function
    agents: [government_schemes_agent]
    params:
      description: Get detailed information about a specific government scheme
  get_selling_advice:
    type: function
    agents: [market_agent]
    params:
      description: |-
        Get selling advice for a commodity

        Args:
            commodity (str): Name of the commodity
            quantity (float, optional): Quantity to sell in quintals
            quality_grade (str): Quality grade - "high", "medium", "low"
            urgency (str): Selling urgency - "urgent", "normal", "flexible"
            tool_context (ToolContext): Optional session context

        Returns:
            Dict: Selling strategy and recommendations
  get_weather_forecast:
    type: function
    agents: [weather_agent]
    params:
      description: |-
        Fetch weather forecast (raw data) for the agent to process.

        Args:
            location (str): Location for weather forecast
            days (int): Number of days for forecast (1-10)
            tool_context (ToolContext): Optional session context

        Returns:
            Dict: Raw forecast data
  search_government_schemes:
    type: function
    agents: [government_schemes_agent]
    params:
      description: Search for government schemes based on farmer's needs

teams:
  agent.create_main_farmbot_agent:
    type: hierarchy
    agents: [agent.create_main_farmbot_agent, weather_agent, market_agent, crop_health_agent, government_schemes_agent]

