    type: env
    params:
      caller: [os.getenv]
      path: [app.google_adk_integration.mandi_db.database]
  ELEVENLABS_API_KEY:
    type: env
    params:
      caller: [os.environ, os.getenv]
      path: [app.main]
  GOOGLE_AI_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [app.google_adk_integration.services.government_schemes_service, app.main_with_google_adk_only]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [app.google_adk_integration.services.government_schemes_service, app.main, app.google_adk_integration.services.crop_health_service]
  MANDI_API_KEY:
    type: env
    params:
      caller: [os.environ]
  WEATHER_API_KEY:
    type: env
    params:
      caller: [os.environ, os.getenv, os.environ.get, WeatherService]
      path: [app.main, app.google_adk_integration.tools.weather_tools, app.main_with_google_adk_only, app.google_adk_integration.services.weather_service]
